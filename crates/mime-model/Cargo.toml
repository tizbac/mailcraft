[package]
name = "mailcraft-mime-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft's messages as Internet messages: mailcraft-mime's reader and writer for the mailbox model, and rich text to HTML and back"

[lints]
workspace = true

[dependencies]
cfb = "0.7.3"
# The class of a message's compound file, as `cfb` names it.
uuid = { version = "1", default-features = false }
mailcraft-mime = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-html = { workspace = true }
mailcraft-time = { workspace = true }
# A `.msg` file read: strings kept in the old one-byte form, and a body kept only as rich text.
mailcraft-charset = { workspace = true }
mailcraft-pst = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
